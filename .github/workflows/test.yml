name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
      - run: go test ./...
      - run: go test -race ./...
      - run: go test -run='^$' -bench=. -benchtime=100ms ./...
